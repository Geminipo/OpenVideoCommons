name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate sample result
        run: python -m ovc validate results/benchmark/wan2.1/example-contributor-local.json

      - name: Smoke test CLI
        run: |
          python -m ovc --help
          python -m ovc detect-hardware
          python -m ovc create-result \
            --github ci-smoke \
            --model wan2.1 \
            --prompt-set motion-basic-v1 \
            --generation-time-sec 1 \
            --output /tmp/ovc-ci-result.json
          python -m ovc validate /tmp/ovc-ci-result.json
          python -m ovc generate-report \
            --results-dir results/benchmark \
            --title "CI Benchmark Report" \
            --output /tmp/ovc-ci-report.md
