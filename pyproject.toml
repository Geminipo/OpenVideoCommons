[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvideocommons"
version = "0.1.0"
description = "Local contribution tooling for the OpenVideoCommons benchmark network."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Geminipo" },
  { name = "OpenVideoCommons contributors" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.scripts]
ovc = "ovc.cli:main"

[tool.setuptools]
packages = ["ovc"]
